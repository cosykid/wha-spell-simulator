name: DB Migrate (copy data)
# Manual one-shot: dump DATABASE_URL (source) and restore into DATABASE_URL_VPS
# (destination). For the Neon -> self-hosted VPS cutover. Full dump (schema +
# data) into an empty destination; set the `clean` input to re-run against a
# non-empty one. See scripts/db-migrate.sh.
on:
  workflow_dispatch:
    inputs:
      clean:
        description: 'Drop existing objects in the destination before restoring'
        type: boolean
        default: false

concurrency:
  group: db-migrate-copy
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install postgresql-client-18 # must match the server major version
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18
      - name: Dump source and restore into VPS
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_VPS: ${{ secrets.DATABASE_URL_VPS }}
          CLEAN: ${{ inputs.clean }}
        run: ./scripts/db-migrate.sh
