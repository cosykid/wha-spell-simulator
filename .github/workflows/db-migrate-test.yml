name: Test Migrations

on:
  pull_request:
    branches: [main]
    paths:
      - 'migrations/**'

jobs:
  test-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scratch
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Apply migrations
        env:
          DATABASE_URL_VPS: postgres://postgres:postgres@localhost:5432/scratch
        run: npm run db:migrate
      - name: Verify idempotency
        env:
          DATABASE_URL_VPS: postgres://postgres:postgres@localhost:5432/scratch
        run: npm run db:migrate
