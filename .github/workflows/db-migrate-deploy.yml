name: Deploy Migrations

on:
  push:
    branches: [main]
    paths:
      - 'migrations/**'

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Apply migrations to VPS
        env:
          DATABASE_URL_VPS: ${{ secrets.DATABASE_URL_VPS }}
        run: npm run db:migrate
      # Migration 014 adds a column the baking code has to fill, and a spell
      # with no thumbnail draws as bare paper. Idempotent: without --all it
      # only touches rows that have none, so this is a no-op most deploys.
      - name: Backfill spell thumbnails
        env:
          DATABASE_URL_VPS: ${{ secrets.DATABASE_URL_VPS }}
        run: npm run spells:backfill-thumbnails
