<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" />
		<!-- Fonts are linked here rather than @imported from tokens.css so the browser
		     opens the connections and requests the faces during the first HTML parse,
		     instead of after it has downloaded and parsed the app stylesheet. -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&amp;family=Cinzel:wght@400;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
